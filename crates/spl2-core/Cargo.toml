# SPDX-License-Identifier: GPL-2.0-only

[package]
name = "spl2-core"
version = "2.0.0-alpha"
edition = "2021"
license = "GPL-2.0-only"
description = "SPL2/QPDL v3 protocol engine for Samsung ML-216x printers"
repository = "https://github.com/caganerg/ml216x-printer-app"

[features]
# Q-6: the classic CUPS Raster parser is kept behind a non-default feature
# rather than `#[cfg(test)]`, so an integration test in another crate can
# replay 1.x inputs while the shipping printer application leaves it out.
golden-replay = []

[dependencies]

# The decoder the G-1 harness reads pages back with. It needs `decompress`,
# which decision Q-6 keeps behind this feature rather than `#[cfg(test)]`.
[[example]]
name = "qpdl-decode"
required-features = ["golden-replay"]
