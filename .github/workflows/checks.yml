# SPDX-License-Identifier: GPL-2.0-only
#
# Every job here runs `scripts/run-checks.sh`, which is also what a
# contributor runs locally, so the enforced check list and the documented one
# cannot drift apart. What each group covers, and what none of them cover, is
# in docs/CI.md; the short version is that release gate G-1 is a measurement
# on paper and no job below can take it.
#
# The two actions used below are pinned to their current major, v7. GitHub
# deprecated the Node.js 20 runtime the v4 tags ran on and was forcing them
# onto Node 24 anyway, with a warning on every run; `actions/checkout` moved
# to Node 24 in v5 and `actions/upload-artifact` only in v6, so v7 is the
# first major where both are current. Neither upgrade changes anything this
# file asks for: checkout is used with no inputs, and the artifact step's
# `name`, `path` and `if-no-files-found` are unchanged. v7 of checkout also
# refuses to check a fork's pull request out under `pull_request_target` and
# `workflow_run`, neither of which this workflow uses.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Two of the signals here arrive without anyone pushing a commit: Debian
  # patching libpappl (which retires a row in the security review) and a new
  # clippy lint on a newer toolchain (which is how the rustc 1.95 lints went
  # unnoticed until they were typed by hand). Monday morning, UTC.
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decision Q-1/D-1: the target is the libpappl Debian trixie ships, 1.3.1,
  # dynamically linked. So the container is trixie and the toolchain is the
  # archive's rustc, not a rustup one — the same combination the .deb is built
  # with. `future-toolchain` below covers the newer-compiler direction.
  build-and-test:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install the target toolchain and libraries
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cargo git libcups2-dev libpappl-dev \
            pkg-config python3 rust-clippy rustc rustfmt
          rustc --version
          pkg-config --modversion pappl
      - uses: actions/checkout@v7
      # The runner before the checks: a group whose middle command fails must
      # abort the run. It did not, for one afternoon; see docs/CI.md.
      - run: ./scripts/run-checks.sh --self-test
      - run: ./scripts/run-checks.sh fmt clippy test features goldens

  # The second supported libpappl, and the reason this job is gating rather
  # than a signal: decision Q-27 says both 1.3.1 and 1.4.12 work, and a claim
  # that only one of them is ever run is a claim nothing checks. The two
  # releases genuinely differ where it matters to this driver — 1.4 numbers a
  # job's pages from 0 where 1.3 numbers them from 1, which failed every job
  # until the driver learned to read the base off the first page — so this is
  # the job that would have caught that.
  #
  # No Debian suite packages 1.4.x, so it is built from source, by the same
  # script the README hands a contributor. `deb` is deliberately not in the
  # group list: the package targets the archive's library and is built by the
  # `package` job against that.
  pappl-1_4:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install the target toolchain and PAPPL's build dependencies
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates cargo cups-ipp-utils curl git \
            libavahi-client-dev libcups2-dev libgnutls28-dev libjpeg-dev libpam0g-dev \
            libpng-dev libusb-1.0-0-dev pkg-config python3 rust-clippy rustc rustfmt \
            zlib1g-dev
      - uses: actions/checkout@v7
      - name: Build and install PAPPL 1.4.12
        run: ./scripts/install-pappl-1.4.sh "$GITHUB_WORKSPACE/pappl-1.4"
      # Both variables, and not ldconfig: pkg-config decides what the crate is
      # compiled against and the linker decides what it runs against, and the
      # point of the job is that those are the same 1.4.12.
      - name: The checks, against 1.4.12
        run: |
          set -eux
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/pappl-1.4/lib/pkgconfig"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/pappl-1.4/lib"
          test "$(pkg-config --modversion pappl)" = 1.4.12
          ./scripts/run-checks.sh fmt clippy test features goldens probes security

  # The hardware-free harnesses, including every injection: a harness that has
  # never been shown to go red is not evidence, and running the injections on
  # every push is how that stays true rather than being a one-off claim in a
  # document.
  harnesses:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install the target toolchain and libraries
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cargo cups-ipp-utils git libcups2-dev \
            libpappl-dev pkg-config python3 rustc
      - uses: actions/checkout@v7
      - run: ./scripts/run-checks.sh probes

  package:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install the target toolchain and libraries
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cargo dpkg git libcups2-dev libpappl-dev \
            pkg-config rustc
      - uses: actions/checkout@v7
      - run: ./scripts/run-checks.sh deb
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  # Deliberately not gating, and it is the *archive's* library that makes it
  # so. This job reproduces the two libpappl overflows (S-1 and S-2 in
  # docs/SECURITY-REVIEW.md) against trixie's 1.3.1, where both still crash the
  # server, and it fails when they stop — most likely because Debian patched
  # them, which is news about the archive rather than a defect in the change
  # under test. A red run here means go and retire the matching review row.
  #
  # The same group against 1.4.12 *is* gating, in `pappl-1_4` above: there the
  # expectation is the other way round — upstream fixed both, so a crash would
  # be a new finding — and the probe reads which of the two it is talking to
  # from the server's own Server: header rather than being told.
  security-signal:
    runs-on: ubuntu-latest
    container: debian:trixie
    continue-on-error: true
    steps:
      - name: Install the target toolchain and libraries
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cargo cups-ipp-utils git libcups2-dev \
            libpappl-dev pkg-config python3 rustc
      - uses: actions/checkout@v7
      - run: ./scripts/run-checks.sh security

  # Also deliberately not gating, and for the opposite reason: it exists to
  # make compiler drift visible early. Three clippy lints that did not exist
  # when the engine was written turned `-D warnings` red on rustc 1.95, and
  # nothing announced it. A newer toolchain's new lint is not a regression in
  # this tree, so it warns rather than blocks — but it warns before the next
  # Debian rustc makes it blocking.
  future-toolchain:
    runs-on: ubuntu-latest
    container: debian:trixie
    continue-on-error: true
    steps:
      - name: Install libraries and the current stable Rust
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libcups2-dev libpappl-dev pkg-config python3
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable \
              --component clippy --component rustfmt
          . "$HOME/.cargo/env"
          rustc --version
      - uses: actions/checkout@v7
      - run: |
          . "$HOME/.cargo/env"
          ./scripts/run-checks.sh fmt clippy test features
