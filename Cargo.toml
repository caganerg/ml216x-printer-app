# SPDX-License-Identifier: GPL-2.0-only

[workspace]
# The 1.x filter stays the root package until P11 is green (decision Q-5);
# the 2.0 crates are added here as they are written.
members = ["crates/pappl-sys", "crates/pappl", "crates/ml216x-printer-app"]

[package]
name = "samsung-2160-rust"
version = "2.0.0-alpha"
edition = "2021"
authors = ["CUPS Raster Filter Developer"]
description = "CUPS/PWG Raster Filter for Linux printing architecture"
license = "GPL-2.0-only"

[dependencies]

[[bin]]
name = "rastertospl-rust"
path = "src/main.rs"

[profile.release]
strip = true
