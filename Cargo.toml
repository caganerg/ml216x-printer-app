# A virtual manifest: the workspace root holds no package of its own. It used
# to be `rastertospl-rust`, the frozen 1.x CUPS filter, kept in the tree by
# decision Q-5 until gate P11. P11 was taken on 2026-09-10 — see
# docs/P11-DELETE-LIST.md for what went and what deliberately stayed. The
# filter's page loop and its 61 tests did not go: they are
# `crates/spl2-core/src/replay.rs` and `crates/spl2-core/tests/`, because the
# golden corpus is the migration's acceptance criterion and had to outlive the
# binary it measures. The 1.x line remains buildable from the annotated tag
# `v1.x-final`.
[workspace]
members = ["crates/spl2-core", "crates/pappl-sys", "crates/pappl", "crates/ml216x-printer-app"]
resolver = "2"

[profile.release]
strip = true
